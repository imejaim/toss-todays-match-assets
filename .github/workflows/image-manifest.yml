name: Update image manifest
on:
  push:
    branches: [main]
    paths:
      - 'public/match_images/**/*.png'
      - 'scripts/generate_manifest.py'
      - 'scripts/excluded_images.json'
      - 'scripts/test_generate_manifest.py'
      - '.github/workflows/image-manifest.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-manifest-main
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test and regenerate
        run: |
          python scripts/test_generate_manifest.py
          python scripts/generate_manifest.py
      - name: Commit manifest only
        run: |
          git add -- public/match_images/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update image manifest'
          git push origin HEAD:main
